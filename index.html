<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل 18+ صريح</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: #1a1a1a;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 100, 0.5);
            overflow: hidden;
            position: relative;
        }

        /* شارة 18+ */
        .age-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ff0055;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 10;
            box-shadow: 0 0 10px #ff0055;
        }

        /* منطقة الفيديو/الصورة */
        .media-area {
            position: relative;
            width: 100%;
            height: 450px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .media-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }

        /* تأثير الضبابية للمحتوى غير المرغوب فيه */
        .blur-content {
            filter: blur(15px);
        }

        /* زر التبديل */
        .toggle-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #ff0055;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            z-index: 10;
            transition: transform 0.2s;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
            background: #ff3377;
        }

        /* شريط التقدم */
        .progress-bar {
            width: 100%;
            height: 5px;
            background: #333;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff0055, #ff6600);
            transition: width 0.1s linear;
        }

        /* معلومات الفيديو */
        .info {
            padding: 20px;
        }

        .info h2 {
            margin: 0 0 10px 0;
            color: #ff0055;
        }

        .tags {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .tag {
            background: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            color: #ccc;
        }

        /* أيقونة التشغيل */
        .play-icon {
            font-size: 3em;
            color: rgba(255, 255, 255, 0.8);
            position: absolute;
            z-index: 5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="age-badge">18+</div>
    
    <div class="media-area" id="mediaArea">
        <div class="play-icon">▶</div>
        <!-- صورة توضيحية (يمكن استبدالها بأي رابط صورة) -->
        <img id="mainImage" src="https://via.placeholder.com/800x450/000000/FFFFFF?text=اضغط+للكشف+عن+العري" alt="18+ Content">
        <button class="toggle-btn" id="toggleBtn">كشف العاري 🔞</button>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="info">
        <h2>مشهد ساخن جداً</h2>
        <p>وصف مختصر للمشهد... عاري، صريح، بدون censura.</p>
        <div class="tags">
            <span class="tag">#عري</span>
            <span class="tag">#بورن</span>
            <span class="tag">#جرأة</span>
            <span class="tag">#18+</span>
        </div>
    </div>
</div>

<script>
    const mediaArea = document.getElementById('mediaArea');
    const mainImage = document.getElementById('mainImage');
    const toggleBtn = document.getElementById('toggleBtn');
    const progressFill = document.getElementById('progressFill');
    let isRevealed = false;

    // محاكاة تشغيل الفيديو/الصورة
    let progress = 0;
    let interval;

    function startProgress() {
        clearInterval(interval);
        progress = 0;
        interval = setInterval(() => {
            progress += 1;
            progressFill.style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(interval);
            }
        }, 50); // سرعة الشريط
    }

    // تأثير الصوت (يمكنك تغيير الرابط)
    function playSound() {
        const audio = new Audio('https://www.soundjay.com/button/sounds/button-16.mp3'); // صوت نقر بسيط
        audio.play().catch(e => console.log("Audio autoplay blocked"));
    }

    // تبديل المحتوى
    toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // منع تفعيل النقر على الصورة
        isRevealed = !isRevealed;
        
        if (isRevealed) {
            mainImage.classList.remove('blur-content');
            mainImage.src = "https://via.placeholder.com/800x450/ff0055/FFFFFF?text=المشهد+الصارخ+(عاري)";
            toggleBtn.textContent = "إخفاء المشهد 👁️";
            toggleBtn.style.background = "#333";
        } else {
            mainImage.classList.add('blur-content');
            mainImage.src = "https://via.placeholder.com/800x450/000000/FFFFFF?text=اضغط+للكشف+عن+العري";
            toggleBtn.textContent = "كشف العاري 🔞";
            toggleBtn.style.background = "#ff0055";
        }
        playSound();
    });

    // عند النقر على منطقة المشاهدة
    mediaArea.addEventListener('click', () => {
        startProgress();
        playSound();
        // يمكنك إضافة منطق لتشغيل فيديو حقيقي هنا
    });

    // بدء شريط التقدم تلقائياً عند التحميل
    window.onload = startProgress;
</script>

</body>
</html>
