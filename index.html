<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucid Dreams - Owned by @akrrma99</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            margin-bottom: 10px;
        }

        .owner-badge {
            background: linear-gradient(45deg, #ff0055, #ff6600);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            border: 1px solid #fff;
        }

        /* شبكة البطاقات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #333;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            border-color: #ff0055;
        }

        .card-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 2em;
        }

        .card-info {
            padding: 15px;
        }

        .card-title {
            font-weight: bold;
            color: #fff;
            margin: 0;
        }

        .card-desc {
            font-size: 0.8em;
            color: #aaa;
            margin-top: 5px;
        }

        .tag-18 {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff0055;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7em;
            font-weight: bold;
        }

        /* النافذة المنبثقة (Modal) */
        .modal-overlay {
            display:        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            position: relative;
            border: 2px solid #ff0055;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 1.5em;
            cursor: pointer;
        }

        /* تذييل الصفحة بعلامة المالك */
        .footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.8em;
            width: 100%;
            border-top: 1px solid #333;
        }

        .owner-footer {
            color: #ff0055;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <h1>Lucid Dreams (18+)</h1>
    
    <!-- شارة المالك -->
    <div class="owner-badge">تم تطويره بواسطة @akrrma99</div>

    <div class="grid-container" id="cardGrid">
        <!-- البطاقات سيتم إنشاؤها بالجافاسكريبت -->
    </div>

    <!-- نافذة المشاهدة -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">عنوان المشهد</h2>
            <div style="width: 100%; height: 300px; background: #000; display: flex; align-items: center; justify-content: center; margin-bottom: 15px;">
                <span style="font-size: 3em;">▶</span>
            </div>
            <p id="modalDesc">وصف تفصيلي للمشهد...</p>
            <button class="toggle-btn" style="width: 100%;">بدء العرض</button>
        </div>
    </div>

    <!-- تذييل الصفحة -->
    <div class="footer">
        جميع الحقوق محفوظة © 2026 | الملكية لـ <span class="owner-footer">@akrrma99</span>
    </div>

<script>
    // بيانات البطاقات (يمكنك إضافة المزيد)
    const cardsData = [
        { title: "Behind on Rent", desc: "أليكسا تأخرت عن الدفع...", img: "🏠" },
        { title: "Stray in the Alley", desc: "نيا في الزقاق...", img: "🌧️" },
        { title: "Catgirl From Another World", desc: "قطة غريبة...", img: "🐱" },
        { title: "Wrong Side of Escort Service", desc: "الينابيع الساخنة...", img: "♨️" },
        { title: "Date Night", desc: "مساءً هادئ...", img: "🍷" },
        { title: "BDSM Dungeon", desc: "غرفة VIP...", img: "⛓️" }
    ];

    const grid = document.getElementById('cardGrid');
    const modal = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    // إنشاء البطاقات
    cardsData.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div class="tag-18">18+</div>
            <div class="card-img">${card.img}</div>
            <div class="card-info">
                <div class="card-title">${card.title}</div>
                <div class="card-desc">${card.desc}</div>
            </div>
        `;
        div.onclick = () => openModal(card);
        grid.appendChild(div);
    });

    function openModal(card) {
        modalTitle.innerText = card.title;
        modalDesc.innerText = card.desc;
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    // إغلاق النافذة عند النقر خارجها
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
