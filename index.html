<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>المختبر التفاعلي - أنمي</title>
  <style>
    :root {
      --bg-dark: #0b0a10;
      --bg-gradient: radial-gradient(circle at top, #1d1533 0%, #0b0a10 60%);
      --card-bg: #16151f;
      --card-border: #282538;
      --accent-purple: #8b75ff;
      --accent-purple-hover: #765ef5;
      --text-main: #ffffff;
      --text-muted: #9e9bb0;
      --nav-bg: rgba(24, 22, 34, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 95px;
      overflow-x: hidden;
    }

    /* الهيدر العلوي */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 10, 16, 0.8);
      backdrop-filter: blur(12px);
    }

    .page-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .currency-pill {
      display: flex;
      align-items: center;
      background: #1b1926;
      border: 1px solid #2e2a40;
      border-radius: 24px;
      padding: 4px 4px 4px 12px;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .currency-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .add-btn {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* المحتوى العام */
    .container {
      padding: 10px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .tab-section {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .tab-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* شريط البحث والفلاتر */
    .search-box {
      width: 100%;
      background: #16151f;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .filter-chips {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .chip {
      background: #1d1b29;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
    }

    /* شبكة البطاقات (الشخصيات والمتجر) */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .char-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
    }

    .char-card:active {
      transform: scale(0.97);
    }

    .char-img-wrap {
      width: 100%;
      height: 190px;
      position: relative;
      background: #211e30;
      overflow: hidden;
    }

    .char-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .price-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(25, 22, 38, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .char-info {
      padding: 12px;
    }

    .char-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .char-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* بطاقات المتجر */
    .premium-banner {
      background: linear-gradient(135deg, #251d42 0%, #171426 100%);
      border: 1px solid #3a2f63;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .premium-banner h3 {
      font-size: 16px;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .premium-banner p {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .purple-btn {
      width: 100%;
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .purple-btn:hover {
      background: var(--accent-purple-hover);
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .info-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-visual {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      margin-bottom: 12px;
      background: radial-gradient(circle, rgba(139,117,255,0.12) 0%, transparent 70%);
      border-radius: 12px;
    }

    /* قسم المحادثات */
    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-purple);
    }

    .chat-details {
      flex: 1;
      overflow: hidden;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chat-title {
      font-weight: 700;
      font-size: 15px;
    }

    .chat-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* قسم الإعدادات */
    .settings-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .status-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--card-border);
      font-size: 15px;
      font-weight: 600;
    }

    .setting-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-row:first-child {
      padding-top: 0;
    }

    /* مفتاح التبديل */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2d2a3e;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-purple);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* شريط التنقل السفلي العائم */
    .bottom-nav {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 400px;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      display: flex;
      justify-content: space-around;
      padding: 10px 8px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .nav-btn.active {
      color: #fff;
      background: rgba(139, 117, 255, 0.2);
    }

    .nav-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* نافذة المحادثة المنبثقة */
    .chat-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 200;
      flex-direction: column;
    }

    .chat-modal.open {
      display: flex;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #16151f;
      border-bottom: 1px solid var(--card-border);
    }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg.bot {
      background: #1d1b29;
      border: 1px solid var(--card-border);
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }

    .msg.user {
      background: var(--accent-purple);
      color: #fff;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
    }

    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #16151f;
      border-top: 1px solid var(--card-border);
    }

    .chat-input-bar input {
      flex: 1;
      background: #0b0a10;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      outline: none;
    }

    .send-btn {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي -->
  <div class="header">
    <div class="page-title" id="headerTitle">الشخصيات</div>
    <div class="currency-pill">
      <div class="currency-item">⚡ <span id="energyCount">10</span></div>
      <div class="currency-item">💎 <span id="diamondCount">100</span></div>
      <button class="add-btn" onclick="addDiamonds()">+</button>
    </div>
  </div>

  <div class="container">
    <!-- 1. قسم الشخصيات -->
    <div id="tab-characters" class="tab-section active">
      <input type="text" class="search-box" id="searchInput" placeholder="ابحث عن شخصية أنمي..." onkeyup="filterCharacters()" />
      
      <div class="filter-chips">
        <button class="chip active" onclick="setFilter('all', this)">الكل</button>
        <button class="chip" onclick="setFilter('anime', this)">أنمي</button>
        <button class="chip" onclick="setFilter('fantasy', this)">خيال ومغامرة</button>
      </div>
